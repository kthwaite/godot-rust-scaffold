[project]
name = "godot-rust-scaffold"
version = "0.1.0"
description = "Interactively scaffold a wired-up Rust and Godot project"
authors = [
    { name = "Kit Thwaite", email = "28732700+kthwaite@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
godot-rust-scaffold = "godot_rust_scaffold.cli:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
